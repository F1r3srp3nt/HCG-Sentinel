name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: SentinelCore tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Start local test services
        run: |
          python3 Tools/local_test_service.py --port 8080 &
          python3 Tools/exposure_test_service.py --http-port 8081 --https-port 8444 &
          sleep 2
          curl -sf http://127.0.0.1:8081/plain > /dev/null
      - name: swift test
        env:
          SENTINEL_TEST_SERVICE_URL: http://127.0.0.1:8080
          SENTINEL_EXPOSURE_HTTP: http://127.0.0.1:8081
          SENTINEL_EXPOSURE_HTTPS: https://127.0.0.1:8444
        run: swift test --package-path SentinelCore 2>&1 | tee core-test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Live assessment output
        if: always()
        run: grep -E "EXPOSURE-CHECK|AUTH-LAB|skipped" core-test.log || true

  app-macos:
    name: App build and tests (Xcode)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Explicit Xcode, so the simulator runtime used below matches the toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "Xcode 26.6 is not on this image:"; ls -d /Applications/Xcode*.app; exit 1; }
          xcodebuild -version
          swift --version
      - name: Project file is up to date
        run: |
          python3 Tools/generate_xcodeproj.py
          git diff --exit-code -- HCGSentinel.xcodeproj
      - name: Start local test services
        run: |
          python3 Tools/local_test_service.py --port 8080 &
          python3 Tools/exposure_test_service.py --http-port 8081 --https-port 8444 &
          sleep 2
          curl -sf http://127.0.0.1:8081/plain > /dev/null
      - name: SentinelCore tests (macOS, includes CryptoKit cross-check)
        env:
          SENTINEL_TEST_SERVICE_URL: http://127.0.0.1:8080
          SENTINEL_EXPOSURE_HTTP: http://127.0.0.1:8081
          SENTINEL_EXPOSURE_HTTPS: https://127.0.0.1:8444
        run: swift test --package-path SentinelCore 2>&1 | tee core-test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Live assessment output (macOS)
        if: always()
        run: grep -E "EXPOSURE-CHECK|AUTH-LAB|skipped" core-test.log || true
      - name: Build for a generic iOS device (unsigned, arm64)
        run: |
          xcodebuild build -project HCGSentinel.xcodeproj -scheme HCGSentinel \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Pick an iPhone simulator
        run: python3 Tools/pick_simulator.py iPhone >> "$GITHUB_ENV"
      - name: Start mock radio node (simulated data only)
        run: |
          echo "SENTINEL_NODE_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Unit tests on iPhone simulator (includes the app against the mock node)
        timeout-minutes: 20
        env:
          TEST_RUNNER_SENTINEL_NODE_URL: ws://127.0.0.1:8765/
          TEST_RUNNER_SENTINEL_NETWORK_CHECK: "1"
        run: |
          python3 Tools/mock_radio_node.py --port 8765 --key "$SENTINEL_NODE_KEY" > mock-node.log 2>&1 &
          sleep 2
          export TEST_RUNNER_SENTINEL_NODE_KEY="$SENTINEL_NODE_KEY"
          set -o pipefail
          xcodebuild test -project HCGSentinel.xcodeproj -scheme HCGSentinel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log | grep -E "CHECK-MY-NETWORK|Test Case .*(failed|skipped)|error:|Executed [0-9]+ test" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-test.log
      - name: Mock node log
        if: always()
        run: cat mock-node.log 2>/dev/null || echo "no mock node log"
      - name: Package the simulator app for the screenshot jobs
        run: tar -C build/tests/Build/Products/Debug-iphonesimulator -czf simulator-app.tar.gz HCGSentinel.app
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: simulator-app.tar.gz
          retention-days: 3

  # Launches the already-built app and photographs every section: a 375-point iPhone (the iPhone X's width) at
  # default, XXXL and an accessibility text size, at the top of each screen and scrolled to the end; and an iPad.
  # Separate from the build-and-test job so a slow simulator boot cannot fail, or be confused with, the tests.
  screenshots:
    name: Simulator screenshots (${{ matrix.device }})
    needs: app-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: small, sizes: "large extra-extra-extra-large accessibility-extra-extra-large" }
          - { device: iPad, sizes: "large" }
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
      - name: Unpack the app and pick a simulator
        run: |
          tar -xzf simulator-app.tar.gz
          python3 Tools/pick_simulator.py "${{ matrix.device }}" >> "$GITHUB_ENV"
      - name: Boot the simulator
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" HCGSentinel.app
      - name: Capture each section at each text size
        timeout-minutes: 30
        run: |
          set -x
          mkdir -p screenshots
          # Each screen is opened by relaunching with a debug-only launch argument. Deep links are not used here:
          # opening a URL from outside the app shows an "Open in …?" system prompt that covers the screen.
          for size in ${{ matrix.sizes }}; do
            xcrun simctl ui "$SIMULATOR_UDID" content_size "$size"
            for pass in top end; do
              for section in dashboard networkcheck network bluetooth radio requests settings capabilities; do
                xcrun simctl terminate "$SIMULATOR_UDID" com.hcg.sentinel || true
                sleep 1
                if [ "$pass" = end ]; then
                  xcrun simctl launch "$SIMULATOR_UDID" com.hcg.sentinel -SentinelSection "$section" -SentinelScrollToEnd YES
                else
                  xcrun simctl launch "$SIMULATOR_UDID" com.hcg.sentinel -SentinelSection "$section"
                fi
                sleep 9
                xcrun simctl io "$SIMULATOR_UDID" screenshot "screenshots/$size-$pass-$section.png"
              done
            done
            # Check My Network after a real run on the runner's network (the check takes up to about a minute).
            xcrun simctl terminate "$SIMULATOR_UDID" com.hcg.sentinel || true
            sleep 1
            xcrun simctl launch "$SIMULATOR_UDID" com.hcg.sentinel -SentinelSection networkcheck -SentinelRunNetworkCheck YES
            sleep 60
            xcrun simctl io "$SIMULATOR_UDID" screenshot "screenshots/$size-run-networkcheck.png"
          done
          xcrun simctl terminate "$SIMULATOR_UDID" com.hcg.sentinel || true
          for file in screenshots/*.png; do sips -Z 1400 "$file" >/dev/null; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots-${{ matrix.device }}
          path: screenshots
          if-no-files-found: ignore
