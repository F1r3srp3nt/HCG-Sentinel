name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: SentinelCore tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Start local test service
        run: |
          python3 Tools/local_test_service.py --port 8080 &
          sleep 1
      - name: swift test
        env:
          SENTINEL_TEST_SERVICE_URL: http://127.0.0.1:8080
        run: swift test --package-path SentinelCore

  app-macos:
    name: App build and tests (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Project file is up to date
        run: |
          python3 Tools/generate_xcodeproj.py
          git diff --exit-code -- HCGSentinel.xcodeproj
      - name: Start local test service
        run: |
          python3 Tools/local_test_service.py --port 8080 &
          sleep 1
      - name: SentinelCore tests (macOS, includes CryptoKit cross-check)
        env:
          SENTINEL_TEST_SERVICE_URL: http://127.0.0.1:8080
        run: swift test --package-path SentinelCore
      - name: Build for a generic iOS device (unsigned, arm64)
        run: |
          xcodebuild build -project HCGSentinel.xcodeproj -scheme HCGSentinel \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Pick an iPhone simulator
        run: python3 Tools/pick_simulator.py iPhone >> "$GITHUB_ENV"
      - name: Unit tests on iPhone simulator
        timeout-minutes: 20
        run: |
          xcodebuild test -project HCGSentinel.xcodeproj -scheme HCGSentinel \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Package the simulator app for the screenshot jobs
        run: tar -C build/tests/Build/Products/Debug-iphonesimulator -czf simulator-app.tar.gz HCGSentinel.app
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: simulator-app.tar.gz
          retention-days: 3

  # Launches the already-built app and photographs every section. Separate from the build-and-test job and one
  # job per device, so a slow simulator boot on a hosted runner cannot fail, or be confused with, the tests.
  screenshots:
    name: Simulator screenshots (${{ matrix.device }})
    needs: app-macos
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
      - name: Unpack the app and pick a simulator
        run: |
          tar -xzf simulator-app.tar.gz
          python3 Tools/pick_simulator.py "${{ matrix.device }}" >> "$GITHUB_ENV"
      - name: Boot the simulator
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Install, launch and capture each section
        timeout-minutes: 8
        run: |
          set -x
          mkdir -p screenshots
          xcrun simctl install "$SIMULATOR_UDID" HCGSentinel.app
          xcrun simctl launch "$SIMULATOR_UDID" com.hcg.sentinel
          sleep 8
          xcrun simctl io "$SIMULATOR_UDID" screenshot "screenshots/${{ matrix.device }}-dashboard.png"
          for section in network bluetooth radio requests settings capabilities; do
            xcrun simctl openurl "$SIMULATOR_UDID" "hcgsentinel://open/$section"
            sleep 4
            xcrun simctl io "$SIMULATOR_UDID" screenshot "screenshots/${{ matrix.device }}-$section.png"
          done
          xcrun simctl terminate "$SIMULATOR_UDID" com.hcg.sentinel || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots-${{ matrix.device }}
          path: screenshots
          if-no-files-found: ignore
