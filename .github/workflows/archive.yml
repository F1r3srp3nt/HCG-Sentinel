name: Archive check

# Archives the app for a generic iOS device with every Xcode installed on the runner images, using the same
# command shape HCG Executable Maker uses. Unsigned: CI holds no signing identity.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  discover:
    name: List installed Xcode versions
    strategy:
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Installed Xcodes
        run: |
          ls -d /Applications/Xcode*.app | while read -r app; do
            real="$(cd "$app" && pwd -P)"
            echo "$app -> $real : $(DEVELOPER_DIR="$real/Contents/Developer" xcodebuild -version | tr '\n' ' ')"
          done
          echo "default: $(xcode-select -p)"

  archive:
    name: Archive (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, xcode: "16.4" }
          - { runner: macos-15, xcode: "26.0" }
          - { runner: macos-26, xcode: "26.2" }
          - { runner: macos-26, xcode: "default" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      BUILD_DIR: ${{ github.workspace }}/build dir with spaces
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" != "default" ]; then
            app="/Applications/Xcode_${{ matrix.xcode }}.app"
            [ -d "$app" ] || { echo "Xcode ${{ matrix.xcode }} is not installed on this image:"; ls -d /Applications/Xcode*.app; exit 1; }
            echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Toolchain and effective settings
        run: Tools/build.sh info
      - name: Archive (unsigned, generic iOS device)
        run: Tools/build.sh archive
      - name: Inspect archived app
        run: Tools/build.sh inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-logs-${{ matrix.runner }}-xcode-${{ matrix.xcode }}
          path: |
            build dir with spaces/logs
            build dir with spaces/*.xcresult
          if-no-files-found: warn
